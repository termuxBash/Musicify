<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
    <a href="/" style="text-decoration:none;">
        <h3 style="color:var(--spotify-green); margin:0;">{{ page_title }}</h3>
    </a>

    <div class="nav-settings">
        <div class="nav-setting">
            <label class="switch" for="autoplayToggle">
                <input type="checkbox" id="autoplayToggle" onchange="toggleAutoplay()">
                <span class="slider"></span>
            </label>
            <label class="nav-setting-label" for="autoplayToggle">Autoplay</label>
        </div>
    </div>

</nav>

<div class="system-monitor" id="systemMonitor">
    <div class="system-monitor-cpu">CPU: <span id="cpu-load" title="CPU status unavailable" aria-label="CPU status unavailable">🚫️</span></div>
    <div class="system-monitor-clock" id="systemMonitorClock" aria-live="polite">
        <span class="system-monitor-time" id="systemMonitorTime"></span>
        <span class="system-monitor-date" id="systemMonitorDate"></span>
    </div>
</div>
