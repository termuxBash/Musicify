<div class="side-panel" id="sidePanel">
    <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3>Music Queue</h3>
        <button class="clear-queue-btn" onclick="clearQueue()">Clear Queue & Stop Music</button>
        <span onclick="toggleMenu()" style="cursor:pointer;font-size:24px;"> ✕ </span>
    </div>

    <div class="queue-playlist-controls">
        <select id="playlistQueueSelect" class="queue-playlist-select" onmouseover="refreshPlaylistDropdown()">
            <option value="">Select Playlist</option>
        </select>
        <button class="queue-playlist-btn" onclick="enqueueSelectedPlaylist()">Queue</button>
    </div>

    <div class="queue-list" id="queueList">
        <p style="color:#666;text-align:center;margin-top:40px;">No songs queued.</p>
    </div>

    {% if show_incogni %}
    <div style="margin: 10px 0 4px 0;">
        <button type="button" class="queue-playlist-btn" id="aiRecommendationsBtn" onclick="openAiPrompt()" style="width:100%;">✨ Ai Recommendations</button>
    </div>
    {% endif %}

    <div class="side-panel-footer">
        <div class="settings-popup-container">
            <div class="settings-popup-menu" id="settingsPopupMenu" onclick="event.stopPropagation()">
                <div class="settings-popup-header">
                    <span>⚙️ Settings</span>
                    <button type="button" class="settings-popup-close" onclick="closeSettingsMenu()" aria-label="Close settings">&times;</button>
                </div>

                <div class="settings-popup-item">
                    <label class="settings-popup-label" for="incogniToggle">Incogni</label>
                    <label class="switch" for="incogniToggle">
                        <input type="checkbox" id="incogniToggle" onchange="toggleIncogni()">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="settings-popup-item">
                    <label class="settings-popup-label" for="lyricsToggle">Lyrics</label>
                    <label class="switch" for="lyricsToggle">
                        <input type="checkbox" id="lyricsToggle" onchange="toggleLyrics()">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="settings-popup-divider"></div>

                <a href="/youtube/hist" class="settings-popup-action-btn">
                    📜 History Database
                </a>

                <button type="button" class="settings-popup-action-btn settings-shutdown-btn" onclick="shutdownServer()">
                    🛑 Shutdown Music Server
                </button>
            </div>

            <div class="side-panel-switch-row">
                <button type="button" class="settings-icon-btn" id="settingsBtn" onclick="toggleSettingsMenu(event)" title="Settings" aria-label="Settings">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <a href="{{ switch_player_url }}" class="switch-player-link">Switch to {{ switch_player_label }}</a>
            </div>
        </div>

        <button type="button" class="queue-playlist-btn" onclick="reconnectStream()">Reconnect <img src="/static/repeat-solid-full.svg"  alt="Reconnect" width="18" height="18" style="vertical-align: middle; margin-left: 5px; filter: invert(1);"></button>
    </div>
</div>
