<div class="player-bar">
    {% if show_live_lyrics %}
    <div id="live-lyrics" style="font-size:0.85rem;color:#1db954;font-weight:bold;margin-top:4px;min-height:1.2em;"></div>
    {% endif %}

    <div class="player-top">
        <div class="now-playing" id="nowPlaying" role="button" tabindex="0" onclick="openNowPlaying()" onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openNowPlaying(); }" aria-label="Open now playing details">
            <img id="playing-thumb" src="/static/speaker.svg" alt="Speaker">
            <div class="now-playing-info">
                <p id="playing-status">IDLE</p>
                <h4 id="playing-title"><span id="playing-title-text">Ready to stream</span></h4>
            </div>
        </div>
        <div class="btn-group">
            <button class="skip-btn" onclick="skipTrack()">SKIP <img src="/static/forward-fast-solid-full.svg" alt="Skip" width="18" height="18" style="vertical-align: middle; margin-left: 5px; filter: brightness(0) invert(1);" /></button>
            <button class="power-btn is-disconnected" id="powerButton" onclick="power()" aria-label="Bose speaker status unavailable">🚫️</button>
        </div>
    </div>

    <div class="player-bottom">
        <div class="volume-cluster">
            <button class="vol-btn" onclick="sendControl('vol_down')">-</button>
            <input type="range" id="vol-slider" min="0" max="100" value="0" oninput="setVolume(this.value)">
            <button class="vol-btn" onclick="sendControl('vol_up')">+</button>
            <span class="vol-val" id="vol-val">0%</span>
        </div>
        <div style="font-size:10px;color:#555;">SYSTEM CONTROL</div>
    </div>
</div>

<div class="now-playing-modal" id="nowPlayingModal" onclick="if(event.target === this) closeNowPlaying()">
    <div class="now-playing-modal-card" role="dialog" aria-modal="true" aria-labelledby="nowPlayingModalTitle">
        <button class="now-playing-modal-close" type="button" onclick="closeNowPlaying()" aria-label="Close now playing details">&times;</button>
        <img class="now-playing-modal-thumb" id="nowPlayingModalThumb" src="" alt="">
        <p class="now-playing-modal-status" id="nowPlayingModalStatus">IDLE</p>
        <h2 id="nowPlayingModalTitle">
            <span id="nowPlayingModalTitleText">Ready to stream</span>
            <span class="now-playing-lyrics-source" id="nowPlayingModalLyricsSource" hidden></span>
        </h2>
        <div class="now-playing-modal-lyrics" id="nowPlayingModalLyrics">No lyrics available</div>
        <div class="now-playing-modal-controls">
            <button class="now-playing-modal-reconnect" type="button" onclick="reconnectStream()" aria-label="Reconnect stream" title="Reconnect stream">
                <img src="/static/repeat-solid-full.svg" alt="">
            </button>
            <div class="volume-cluster now-playing-modal-volume">
                <button class="vol-btn" type="button" onclick="sendControl('vol_down')" aria-label="Decrease volume">-</button>
                <input type="range" min="0" max="100" value="0" oninput="setVolume(this.value)" aria-label="Volume">
                <button class="vol-btn" type="button" onclick="sendControl('vol_up')" aria-label="Increase volume">+</button>
                <span class="vol-val">0%</span>
            </div>
        </div>
    </div>
</div>
